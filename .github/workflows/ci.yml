name: ci

on:
  push:
    branches: [main, "build/**", "codex/**", "feature/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaling-controller
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install '.[dev,compile,service,smf]'
      - run: ruff check solace_autoscale solace_autoscale_client tests ../examples
      - run: mypy solace_autoscale
      - run: pytest -m "not integration" -q
      - name: Validate customer exercise
        working-directory: .
        run: python examples/customer_library.py

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: shim/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
