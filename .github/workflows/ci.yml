name: ci

on:
  push:
    branches: [main, "build/**", "codex/**", "feature/**"]
  pull_request:

jobs:
  test:
    # Python control plane lives under scaling-controller/.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaling-controller
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check solace_autoscale tests solace_autoscale_client
      - name: Type check
        run: mypy solace_autoscale
      - name: Test (unit only; integration needs a live broker)
        run: pytest -m "not integration" -q

  shim:
    # Native Go smart shim lives under shim/.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shim
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: shim/go.sum
      - name: Format
        # gofmt -l lists files that are not gofmt-clean; any output fails the job.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  compile-synthetic-model:
    # §6: the compiler runs in CI. Here it recompiles the synthetic placeholder from its generator
    # and asserts the committed model is byte-identical, so a compiler change that would alter the
    # model can't slip in unnoticed. Real customer workbooks are never in CI (§12).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e './scaling-controller[dev]'
      - name: Regenerate synthetic model and check it is committed unchanged
        run: |
          python scripts/make_synthetic_model.py
          git diff --exit-code models/synthetic-v0.json
      - name: Validate the synthetic model across the full matrix
        run: |
          cat > /tmp/ci.yaml <<'YAML'
          capacity: {model: models/synthetic-v0.json}
          metrics: {source: static}
          YAML
          solace-autoscale simulate --config /tmp/ci.yaml

  integration:
    # Live-broker protocol integration tests (§9.3 gate). Runs a real Solace broker as a service.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaling-controller
    services:
      solace:
        image: solace/solace-pubsub-standard:latest
        ports:
          - 8080:8080
          - 55555:55555
          - 5672:5672
          - 1883:1883
          - 9000:9000
        env:
          username_admin_globalaccesslevel: admin
          username_admin_password: admin
        options: >-
          --shm-size=1g
          --ulimit core=-1
          --ulimit nofile=1048576:1048576
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (with integration protocol clients)
        run: pip install -e '.[dev,integration]'
      - name: Wait for broker SEMP + enable services
        working-directory: .
        run: |
          for i in $(seq 1 60); do
            curl -s -u admin:admin http://localhost:8080/SEMP/v2/monitor/about/api | grep -q sempVersion && break
            sleep 3
          done
          B=http://localhost:8080/SEMP/v2/config
          curl -s -u admin:admin -X PATCH "$B/msgVpns/default/clientUsernames/default" -H 'Content-Type: application/json' -d '{"enabled":true,"password":"default"}'
          curl -s -u admin:admin -X PATCH "$B/msgVpns/default" -H 'Content-Type: application/json' -d '{"authenticationBasicEnabled":true,"authenticationBasicType":"internal","serviceAmqpPlainTextEnabled":true,"serviceMqttPlainTextEnabled":true,"serviceRestIncomingPlainTextEnabled":true,"maxMsgSpoolUsage":1500}'
          curl -s -u admin:admin -X POST "$B/msgVpns/default/queues" -H 'Content-Type: application/json' -d '{"queueName":"q.test","accessType":"exclusive","permission":"consume","ingressEnabled":true,"egressEnabled":true}'
          curl -s -u admin:admin -X POST "$B/msgVpns/default/queues/q.test/subscriptions" -H 'Content-Type: application/json' -d '{"subscriptionTopic":"test/guaranteed/>"}'
      - name: Integration tests (CI broker uses default 55555/5672/1883/9000)
        env:
          SOLACE_SMF_PORT: "55555"
          SOLACE_AMQP_PORT: "5672"
          SOLACE_MQTT_PORT: "1883"
          SOLACE_REST_PORT: "9000"
        run: pytest tests/test_integration_broker.py -m integration -q

  migration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scaling-controller
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev,integration]'
      - name: Start two isolated migration brokers
        run: |
          for spec in "a 18081 15556 15672" "b 18082 15557 15673"; do
            set -- $spec
            docker run -d --name migration-$1 --shm-size=1g --ulimit core=-1 --ulimit nofile=2448:1048576 \
              -p $2:8080 -p $3:55555 -p $4:5672 \
              -e username_admin_globalaccesslevel=admin -e username_admin_password=admin \
              solace/solace-pubsub-standard:latest
          done
          for port in 18081 18082; do
            B=http://127.0.0.1:$port/SEMP/v2/config
            ready=false
            for i in $(seq 1 60); do
              if curl -fsS -u admin:admin "$B/about/api" >/dev/null 2>&1; then
                ready=true
                break
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' migration-a)" != true ] ||
                 [ "$(docker inspect -f '{{.State.Running}}' migration-b)" != true ]; then
                break
              fi
              sleep 3
            done
            if [ "$ready" != true ]; then
              docker inspect -f '{{.Name}} {{json .State}}' migration-a migration-b
              docker logs --tail 100 migration-a
              docker logs --tail 100 migration-b
              exit 1
            fi
            curl -fsS -u admin:admin -X PATCH "$B/msgVpns/default/clientUsernames/default" \
              -H 'Content-Type: application/json' -d '{"enabled":true,"password":"default"}'
            curl -fsS -u admin:admin -X PATCH "$B/msgVpns/default" \
              -H 'Content-Type: application/json' \
              -d '{"authenticationBasicEnabled":true,"authenticationBasicType":"internal","maxMsgSpoolUsage":1500,"serviceAmqpPlainTextEnabled":true}'
          done
      - name: Wait for message spools and durable queue operations
        run: python ../scripts/wait-solace-queues.py 18081 18082
      - name: Prove queue handover, publisher NACK, durable retry and restart
        run: pytest tests/test_integration_migration.py tests/test_integration_native_topics.py -m integration -q
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: shim/go.sum
      - name: Prepare Go settlement queue
        run: |
          B=http://127.0.0.1:18081/SEMP/v2/config/msgVpns/default/queues
          curl -fsS -u admin:admin -X POST "$B" -H 'Content-Type: application/json' -d '{"queueName":"q-go-settlement","accessType":"exclusive","permission":"consume","ingressEnabled":true,"egressEnabled":true}'
          curl -fsS -u admin:admin -X POST "$B/q-go-settlement/subscriptions" -H 'Content-Type: application/json' -d '{"subscriptionTopic":"autoscale/go/settlement"}'
      - name: Prove application-controlled AMQP acknowledgement and redelivery
        working-directory: shim
        env:
          SOLACE_GO_AMQP_URI: amqp://default:default@127.0.0.1:15672
        run: go test -race ./...
      - name: Prove managed Go publisher crash recovery and native fanout
        run: pytest tests/test_integration_go_managed.py -m integration -q
      - name: Broker diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 100 migration-a || true
          docker logs --tail 100 migration-b || true
