name: cloud-qualification

on:
  workflow_dispatch:
    inputs:
      confirm_non_billable:
        description: "Type INTERNAL-NON-BILLABLE after account authorization"
        required: true
        type: string

concurrency:
  group: solace-cloud-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: solace-cloud-qualification
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e './scaling-controller[dev,service,integration]'
      - name: Validate explicit billing authorization
        env:
          CONFIRMATION: ${{ inputs.confirm_non_billable }}
        run: test "$CONFIRMATION" = INTERNAL-NON-BILLABLE
      - name: Restore private qualification plan
        env:
          PLAN_JSON: ${{ secrets.SOLACE_CLOUD_QUALIFICATION_PLAN }}
        run: |
          test -n "$PLAN_JSON"
          install -d -m 700 state/cloud-qualification
          printf '%s' "$PLAN_JSON" > state/cloud-qualification/plan.json
          chmod 600 state/cloud-qualification/plan.json
      - name: Run bounded Cloud qualification
        env:
          SOLACE_CLOUD_TOKEN: ${{ secrets.SOLACE_CLOUD_TOKEN }}
        run: |
          printf 'bearer=%s\n' "$SOLACE_CLOUD_TOKEN" > .env
          chmod 600 .env
          PYTHONPATH=scaling-controller python scripts/cloud-qualification.py \
            --plan state/cloud-qualification/plan.json \
            --journal state/cloud-qualification/run.json \
            --create > cloud-qualification-result.json
      - name: Emergency exact-ID cleanup
        if: failure()
        env:
          SOLACE_CLOUD_TOKEN: ${{ secrets.SOLACE_CLOUD_TOKEN }}
        run: |
          PYTHONPATH=scaling-controller python scripts/cloud-qualification.py \
            --plan state/cloud-qualification/plan.json \
            --journal state/cloud-qualification/run.json \
            --cleanup
      - name: Upload redacted qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-qualification-result
          path: cloud-qualification-result.json
          if-no-files-found: error
          retention-days: 14
