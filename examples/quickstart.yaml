# Fictional capacities and prices, for learning only. Run from the repository root.
capacity:
  model: models/synthetic-v0.json
fleet:
  service_class: enterprise-250
  min_brokers: 1
  max_brokers: 4
workload:
  delivery: direct
  bottleneck: auto
metrics:
  source: static
  scrape_interval: 30
  staleness_limit: 180
policy:
  warm_pool: 0
  headroom:
    mode: fixed
  scale_up_window: 90
  scale_down_window: 300
billing:
  model: elastic
  per_broker_monthly:
    enterprise-250: 100  # fictional, not a Solace quote
actuation:
  mode: recommend
  dry_run: true
