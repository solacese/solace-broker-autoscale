[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solace-autoscale"
version = "0.1.0"
description = "Managed-partition controller and Python publisher/subscriber client for existing Solace brokers. Community project, not a supported product."
readme = { text = "Solace managed-partition controller and Python publisher/subscriber client.", content-type = "text/plain" }
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "solace-autoscale contributors" }]
keywords = ["messaging", "autoscaling", "capacity-planning", "control-plane"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6",
  "httpx>=0.27",
  "click>=8.1",
]

[project.optional-dependencies]
compile = ["openpyxl>=3.1"]
smf = ["solace-pubsubplus>=1.8"]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "openpyxl>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "solace-pubsubplus>=1.8",
]
# Protocol clients for the live-broker integration tests (pytest -m integration).
integration = [
  "paho-mqtt>=2",
  "python-qpid-proton>=0.39",
  "solace-pubsubplus>=1.8",
  "requests>=2.31",
]

[project.scripts]
solace-autoscale = "solace_autoscale.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["solace_autoscale*", "solace_autoscale_client*"]

[tool.setuptools.package-data]
solace_autoscale = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a live broker (deselect with -m 'not integration')",
]
# Bare pytest excludes tests that require separately managed live brokers and protocol clients.
addopts = '-ra -m "not integration"'

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests use compact table-building assignments and long fixture literals.
"tests/*" = ["E501", "E702", "F841"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
# JSON/HTTP boundaries (collectors, cloud client, FastAPI handlers) return dynamically-typed data;
# requiring full generic parametrisation and non-Any returns there adds casts without adding safety.
disallow_any_generics = false
warn_return_any = false
