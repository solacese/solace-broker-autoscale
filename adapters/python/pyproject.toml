[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solace-autoscale-client"
version = "0.1.0"
description = "Partition routing and managed queue handover clients for Solace autoscale"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
smf = ["solace-pubsubplus>=1.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["solace_autoscale_client*"]
